name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR makes an in-flight run obsolete.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # `next typegen` and `next build` both evaluate next.config.ts, which needs
    # NEXT_PUBLIC_SUPABASE_URL to be a parseable URL. CI never talks to Supabase
    # (tests mock it), so placeholders are enough — the real values come from
    # Vercel's project env at deploy time.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
