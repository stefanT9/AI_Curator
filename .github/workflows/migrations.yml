name: Deploy migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"
  # Lets you re-run a failed deploy without an empty commit.
  workflow_dispatch:

# Migrations apply in timestamp order, so two runs pushing at once can
# interleave and corrupt the history. Never cancel in progress — a half-applied
# push is worse than a queued one.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Apply migrations
        run: supabase db push
